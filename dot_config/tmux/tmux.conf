# Base
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
# size a window to the largest attached client, not the most recent one
set -g window-size largest
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g default-shell /opt/homebrew/bin/fish
set-environment -g SHELL /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-features ",xterm-256color:RGB"
set -s extended-keys on
# csi-u is what ghostty sends natively
set -s extended-keys-format csi-u
set -as terminal-features "xterm-ghostty:extkeys"
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm" # undercurl
set -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m"
setw -g mode-keys vi
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g status-position bottom
set -g status-interval 5
set -g window-active-style   "bg=default"
set -g window-style          "fg=#a5adcb"

# Panes, windows, sessions
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{session_path}" # the project dir proj created the session with
bind C command-prompt -p "session:" "new-session -s '%%' -c '$HOME'"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
# only a new server picks up removed binds
bind K confirm-before -p "kill the tmux server, every session dies? (y/n)" kill-server
# cmd+k support in tmux
bind k send-keys C-l \; run-shell -b "sleep 0.4; tmux -S #{socket_path} clear-history -t #{pane_id}"
bind w display-popup -E -w 70% -h 60% "$HOME/.local/bin/proj"

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Smart splits
#
# @pane-is-vim is a pane option smart-splits.nvim sets on load and clears on
# exit or suspend
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'
bind -n 'C-\' if -F "#{@pane-is-vim}" 'send-keys C-\\' 'select-pane -l'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Status line
#
# catppuccin macchiato
set -g @base     "#24273a"
set -g @mantle   "#1e2030"
set -g @surface0 "#363a4f"
set -g @text     "#cad3f5"
set -g @blue     "#8aadf4"
set -g @green    "#a6da95"
set -g @peach    "#f5a97f"
set -g @yellow   "#eed49f"

set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g visual-bell off

set -g status-style "bg=#{@mantle},fg=#{@text}"
set -g window-status-activity-style default
set -g window-status-bell-style default
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 120
set -g window-status-separator ""

set -g status-left " #[bold]#{?client_prefix,#[bg=#{@peach}]#[fg=#{@base}] LDR #[default]#[bold],}#[fg=#{@green}]  #S #[default]│"
set -g status-right "#{?#{e|>=:#{client_width},100},#(~/.config/tmux/right.sh '#{pane_current_path}') #[fg=#{@blue}]󰌢 #h ,}"

# * unseen output, ! bell, Z zoomed, and the pane |
set -g window-status-format         "#[fg=#{@green},bold] #I #[default]#{?#{e|>=:#{client_width},100},#(~/.config/tmux/icon.sh '#{pane_current_command}' '#{pane_pid}') ,}#{?#{e|>=:#{client_width},100},#{=/18/…:window_name},#{=/10/…:window_name}}#[fg=#{@yellow}]#{?window_activity_flag, *,}#{?window_bell_flag, !,}#[default]#{?#{>:#{window_panes},1}, #{window_panes},} "
set -g window-status-current-format "#[bg=#{@blue},fg=#{@base},bold] #I #{?#{e|>=:#{client_width},100},#(~/.config/tmux/icon.sh '#{pane_current_command}' '#{pane_pid}') ,}#{?#{e|>=:#{client_width},100},#{=/18/…:window_name},#{=/10/…:window_name}}#{?window_zoomed_flag, Z,}#{?#{>:#{window_panes},1}, #{window_panes},} #[default]"
